<aside class="sidebar d-none d-lg-flex">
    <div class="sidebar-brand">
        <a href="index.html" class="brand-logo">
            Global <span class="hub">InvestHub</span>
        </a>
    </div>

    <nav class="sidebar-nav mt-3">
        <a class="sidebar-link" routerLink="/app/dashboard"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a class="sidebar-link" routerLink="/app/marketplace"><i class="bi bi-shop"></i> Marketplace</a>
        <a class="sidebar-link" routerLink="/app/engines"><i class="bi bi-cpu"></i> Engines</a>
        <a class="sidebar-link" routerLink="/app/portfolio"><i class="bi bi-pie-chart"></i> Portfolio</a>
        <a class="sidebar-link" routerLink="/app/settings"><i class="bi bi-gear"></i> Settings</a>
    </nav>

    <div class="sidebar-profile">
        <div class="avatar">{{ iniciales() }}</div>
        <div>
            <div class="fw-semibold" style="font-size: 0.9rem;">{{ auth.usuario()?.nombre }}</div>
            <div class="text-muted" style="font-size: 0.75rem;">
                @if (planActual(); as plan) { {{ plan.nombre }} Member } @else { Member }
            </div>
        </div>
        <button type="button" class="btn-logout" title="Cerrar sesión" (click)="auth.logout()">
            <i class="bi bi-box-arrow-right"></i>
        </button>
    </div>
</aside>
