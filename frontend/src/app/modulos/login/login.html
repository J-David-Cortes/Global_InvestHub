<div class="login-wrapper">
    <div class="login-card">
        <div class="text-center mb-4">
            <a href="index.html" class="brand-logo d-block mb-2">
                Global <span class="hub">InvestHub</span>
            </a>
            <p class="text-muted fs-6">Sign in to your account</p>
        </div>

        <form (submit)="alEnviar($event)">
            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control form-control-dark w-100" placeholder="name@company.com"
                    [value]="email()" (input)="actualizarEmail($any($event.target).value)" required>
            </div>

            <div class="mb-4">
                <label class="form-label mb-0">Password</label>
                <input type="password" class="form-control form-control-dark w-100" placeholder="••••••••"
                    [value]="clave()" (input)="actualizarClave($any($event.target).value)" required>
            </div>

            @if (errorMensaje(); as msg) {
            <div class="mensaje-error-login">
                <i class="bi bi-exclamation-circle"></i>
                {{ msg }}
            </div>
            }

            <button type="submit" class="btn btn-cyan w-100 py-2" [disabled]="!puedeEnviar()">
                @if (enviando()) { Signing in... } @else { Sign In }
            </button>
        </form>
    </div>
</div>
