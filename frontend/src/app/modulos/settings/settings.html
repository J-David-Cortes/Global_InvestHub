<div class="settings-container">

    <header class="settings-header">
        <p class="settings-breadcrumb">Home / Settings</p>
        <h1 class="settings-titulo">SETTINGS</h1>
    </header>

    <div class="settings-layout">

        <!-- Sidebar de pestañas -->
        <nav class="settings-tabs-nav">
            @for (pestana of pestanas; track pestana.id) {
            <button class="settings-tab-btn" [class.settings-tab-btn-activa]="pestanaActiva() === pestana.id"
                (click)="seleccionarPestana(pestana.id)">
                <i class="bi" [class]="pestana.icono"></i>
                {{ pestana.etiqueta }}
            </button>
            }
        </nav>

        <!-- Contenido de la pestaña activa -->
        <div class="settings-contenido">
            @switch (pestanaActiva()) {
            @case ('profile') { <app-profile-tab /> }
            @case ('security') { <app-security-tab /> }
            @case ('notifications') { <app-notifications-tab /> }
            @case ('apikeys') { <app-api-keys-tab /> }
            @case ('billing') { <app-billing-tab /> }
            }
        </div>

    </div>

</div>
