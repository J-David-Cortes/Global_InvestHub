<div class="legal-wrapper">
    <div class="legal-card">
        <div class="legal-aviso-borrador">
            <i class="bi bi-exclamation-triangle"></i>
            BORRADOR: pendiente de revisión legal. Este texto no es definitivo.
        </div>

        <h1 class="legal-titulo">{{ titulo() }}</h1>
        <p class="legal-version">Versión: {{ version }}</p>

        <div class="legal-contenido">
            <ng-content></ng-content>
        </div>

        <div class="legal-volver">
            <a routerLink="/" class="nav-link-custom text-decoration-none">← Volver al inicio</a>
            <span class="legal-separador">·</span>
            <a routerLink="/registro" class="nav-link-custom text-decoration-none">Ir al registro</a>
        </div>
    </div>
</div>
